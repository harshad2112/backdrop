				if (i === -1) excluded.push(value); else excluded.splice(i, 1);
				setExcluded(excluded);
				target.classList.toggle('excluded', i === -1);
				renderStatus();
			} else if (action === 'all' || action === 'none') {
				// only this tab's source; other sources keep their selection
				var names = images.filter(function(img) { return img.source === value; })
					.map(function(img) { return img.name; });
				var others = getExcluded().filter(function(n) { return names.indexOf(n) === -1; });
				setExcluded(action === 'all' ? others : others.concat(names));
				renderSettings();
			} else if (action === 'tab') {
				switchTab(value);
			} else if (action === 'refresh') {
				refreshAll('update');
				renderStatus();
			} else if (action === 'url') {
				var input = prompt('Enter URL of a ZIP file with images', setting('playout_url', ''));
				if (input) {
					localStorage.setItem('playout_url', input.replace(/&amp;/g, '&'));
					localStorage.setItem('lastUpdated', '0'); // new link: download it now
					refreshAll('auto');
					renderSettings();
				}
			}
		}

		// Left/Right: adjust sliders and switches, open sections from the menu, otherwise move
		function sideways(dir) {
			var target = focusedElement();
			var action = target && target.getAttribute('data-action');
			if (action === 'brightness') adjustBrightness(target, dir * BRIGHTNESS_STEP);
			else if (action === 'switch') setSwitch(target, dir > 0);
			else if (action === 'open' && dir > 0) activate();
			else if (action === 'tab') {
				// moving along the tab bar switches tabs straight away
				moveFocus(0, dir);
				switchTab(focusedElement().getAttribute('data-value'));
			}
			else moveFocus(0, dir);
		}

		// ---------- keys ----------

		function registerKeys() {
			['MediaPlayPause', 'MediaPlay', 'MediaPause', 'Info'].forEach(function(name) {
				try {
					tizen.tvinputdevice.registerKey(name);
					KEY[name] = tizen.tvinputdevice.getKey(name).code;
				} catch (e) {
					// key not on this remote
				}
			});
		}

		function isSettingsKey(code) {
			return code === KEY.PLAYPAUSE || code === KEY.PLAY || code === KEY.PAUSE || code === KEY.INFO ||
				code === KEY.MediaPlayPause || code === KEY.MediaPlay || code === KEY.MediaPause || code === KEY.Info;
		}

		document.addEventListener('keydown', function(event) {
			var code = event.keyCode;

			if (settingsOpen) {
				if (isSettingsKey(code)) closeSettings();
				else if (code === KEY.RETURN) {
					if (settingsPage === 'main') closeSettings(); else backToMenu();
				}
				else if (code === KEY.UP) moveFocus(-1, 0);
				else if (code === KEY.DOWN) moveFocus(1, 0);
				else if (code === KEY.LEFT) sideways(-1);
				else if (code === KEY.RIGHT) sideways(1);
				else if (code === KEY.ENTER) activate();
				event.preventDefault();
				return;
			}

			if (isSettingsKey(code)) openSettings();
			else if (code === KEY.ENTER) toggleFavorite();
			else if (code === KEY.LEFT && playlist.length > 1) prevSlide();
			else if (code === KEY.RIGHT && playlist.length > 1) nextSlide();
			else if (code === KEY.RETURN) {
				// hide instead of exit so the slideshow stays loaded in the background
				tizen.application.getCurrentApplication().hide();
			}
		});

		// ---------- start ----------

		function onLoad() {
			if (window.tizen === undefined) {
				showMessage('TIZEN API is not supported on this device');
				return;
			}

			registerKeys();
			setDef();
			applyBrightness();
			updateClock();
			setInterval(updateClock, 1000);

			// image folders left in Downloads by the earlier prototype of this app
			['wallA', 'wallB'].forEach(function(name) {
				removeDir(name, function() {});
			});

			// show the local copy right away, then fetch whatever is due
			reloadImages(function() {
				(function update() {
					refreshAll('auto', function() {
						// nothing to show yet (e.g. no network on first start): try again soon
						if (!images.length) setTimeout(update, 60 * 1000);
					});
				})();
			});

			setInterval(function() { refreshAll('auto'); }, CHECK_EVERY_MS);
		}
	</script>
</head>
<body onload="onLoad();">
	<img id="layer0" class="layer" alt=""/>
	<img id="layer1" class="layer" alt=""/>
	<div id="clock">
		<div class="time-row"><span class="time"></span><span class="ampm"></span></div>
		<div class="date"></div>
	</div>
	<div id="credit"></div>
	<div id="toast"></div>
	<div id="dim"></div>
	<div id="message"></div>
	<div id="overlay"><div class="panel" id="panel"></div></div>
</body>
</html>
